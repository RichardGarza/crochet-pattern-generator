<style>
  html, body { margin: 0; height: 100%; background: #f4efe6; font-family: Helvetica, Arial, sans-serif; color: #2b2420; }

<body>
<three-d-stage name="amigurumi-teddy-bear" background="#f4efe6"></three-d-stage>
<div class="label">
  <h1>Amigurumi Teddy Bear</h1>
  <p>10 in · sitting · 17 crochet parts · units: inches</p>
</div>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const spec = JSON.parse(document.getElementById('crochet-model').textContent);

const mats = {};
function material(hex) {
  const key = hex.toUpperCase();
  if (mats[key]) return mats[key];
  const name = (spec.palette && (spec.palette[hex] || spec.palette[key])) || 'yarn_' + key.slice(1);
  const eye = name.includes('eye');
  const m = new THREE.MeshStandardMaterial({
    name, color: new THREE.Color(hex),
    roughness: eye ? 0.15 : 0.95, metalness: eye ? 0.1 : 0
  });
  return (mats[key] = m);
}

function geometry(p) {
  const d = p.dimensions;
  switch (p.type) {
    case 'sphere': return new THREE.SphereGeometry(d.r, 48, 32);
    case 'ellipsoid': return new THREE.SphereGeometry(1, 64, 40).scale(d.rx, d.ry, d.rz);
    case 'capsule': return new THREE.CapsuleGeometry(d.radius, d.length, 16, 48);
    case 'cylinder': return new THREE.CylinderGeometry(d.radiusTop ?? d.radius, d.radiusBottom ?? d.radius, d.height, 48);
    case 'cone': return new THREE.ConeGeometry(d.radius, d.height, 48);
    default: throw new Error('Unknown part type: ' + p.type);
  }
}

const root = new THREE.Group();
root.name = 'amigurumi_teddy_bear';
const nodes = {};
for (const p of spec.parts) {
  const mesh = new THREE.Mesh(geometry(p), material(p.color));
  mesh.name = p.id;
  mesh.userData = { name: p.name, type: p.type, dimensions: p.dimensions };
  mesh.position.fromArray(p.position);
  const r = p.rotationDeg.map(THREE.MathUtils.degToRad);
  mesh.rotation.set(r[0], r[1], r[2], 'XYZ');
  nodes[p.id] = mesh;
}
for (const p of spec.parts) (p.parent ? nodes[p.parent] : root).add(nodes[p.id]);

stage.setObject(root);
</script>
</body>
