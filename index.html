<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Turn pictures, photos and 3D models into complete crochet patterns. Runs locally in the browser." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='15' cy='15' r='12' fill='%23a94b25'/%3E%3Cg fill='none' stroke='%23fff' stroke-opacity='.55' stroke-width='1.6' stroke-linecap='round'%3E%3Cpath d='M6.2 7.6c4.6 2.6 8.6 8.5 8.6 19.3'/%3E%3Cpath d='M3.4 13.6c6.2.2 13.8 4.1 17.2 11.9'/%3E%3Cpath d='M11 3.6c5.9 1.7 12.4 7.3 14.7 14.4'/%3E%3C/g%3E%3C/svg%3E" />
    <title>Crochet Pattern Generator</title>
    <script>
      // The theme the user picked (ui/shell/theme.ts), applied before the first paint so a dark choice never
      // flashes light.
      try {
        var t = localStorage.getItem('cpg.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      /* First paint, before the app's styles load: the page background of each theme (tokens.css). */
      html { background: #f6f3ee; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #171513; } }
      html[data-theme='dark'] { background: #171513; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
